name: Daily Digest (Free)

on:
  schedule:
    # 07:00 UTC daily. Cron is always UTC — adjust for your timezone.
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Generate today's digest
        run: python daily-digest-free/scripts/generate_digest.py

      - name: Commit updated page
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add daily-digest-free/docs/index.html
          git diff --quiet --cached || git commit -m "Update daily digest"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: daily-digest-free/docs

  deploy:
    needs: build-digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
